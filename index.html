<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тест офлайн</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #eee;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            margin: 5px 0;
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            opacity: .5;
        }

        .progress {
            margin-top: 20px;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: #4caf50;
            transition: width .2s;
        }

        #status {
            margin-top: 15px;
            line-height: 1.5;
        }

        .ok {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Тест офлайн-режима</h1>

    <p>
        Сначала нажмите кнопку загрузки, затем полностью
        закройте браузер, отключите интернет и снова откройте эту страницу.
    </p>

    <p id="connection"></p>

    <button id="download">
        Скачать для офлайн
    </button>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div id="status">
        Офлайн-версия не загружена.
    </div>

    <hr>

    <h2>Аудио</h2>

    <audio controls>
        <source src="./bh.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает audio.
    </audio>

</div>


<script>

const CACHE_NAME = 'estate-offline-test-v1';


// --------------------------------------------------
// Папка сайта
// --------------------------------------------------

const BASE = location.pathname.endsWith('/')
    ? location.pathname
    : location.pathname.substring(
        0,
        location.pathname.lastIndexOf('/') + 1
    );


// --------------------------------------------------
// Что сохраняем
// --------------------------------------------------

const FILES = [
    BASE + 'index.html',
    BASE + 'bh.mp3'
];


const downloadButton =
    document.getElementById('download');

const progress =
    document.getElementById('progress');

const status =
    document.getElementById('status');

const connection =
    document.getElementById('connection');


// --------------------------------------------------
// Интернет
// --------------------------------------------------

function updateConnection() {

    if (navigator.onLine) {

        connection.textContent =
            '● Интернет подключён';

    } else {

        connection.textContent =
            '● ИНТЕРНЕТ ОТКЛЮЧЁН';

    }

}

updateConnection();

window.addEventListener(
    'online',
    updateConnection
);

window.addEventListener(
    'offline',
    updateConnection
);


// --------------------------------------------------
// Service Worker
// --------------------------------------------------

async function registerServiceWorker() {

    if (!('serviceWorker' in navigator)) {

        status.innerHTML =
            '<span class="error">' +
            'Service Worker не поддерживается' +
            '</span>';

        return;

    }

    try {

        await navigator.serviceWorker.register(
            BASE + 'sw.js',
            {
                scope: BASE
            }
        );

        console.log(
            'Service Worker зарегистрирован'
        );

    } catch (error) {

        console.error(error);

        status.innerHTML =
            '<span class="error">' +
            'Ошибка Service Worker: ' +
            error.message +
            '</span>';

    }

}

registerServiceWorker();


// --------------------------------------------------
// Проверка уже скачанной версии
// --------------------------------------------------

async function checkCache() {

    try {

        const cache =
            await caches.open(CACHE_NAME);

        const index =
            await cache.match(
                BASE + 'index.html'
            );

        const audio =
            await cache.match(
                BASE + 'bh.mp3'
            );

        if (index && audio) {

            progress.style.width = '100%';

            status.innerHTML =
                '<span class="ok">' +
                '✓ Офлайн-версия найдена' +
                '<br>Страница и аудио сохранены.' +
                '</span>';

            downloadButton.textContent =
                'Офлайн-версия уже загружена';

        }

    } catch (error) {

        console.error(error);

    }

}

checkCache();


// --------------------------------------------------
// Скачать
// --------------------------------------------------

downloadButton.addEventListener(
    'click',
    async () => {

        downloadButton.disabled = true;

        progress.style.width = '0%';

        status.textContent =
            'Начинаем загрузку...';

        try {

            const cache =
                await caches.open(CACHE_NAME);

            for (
                let i = 0;
                i < FILES.length;
                i++
            ) {

                const file = FILES[i];

                status.textContent =
                    'Загрузка ' +
                    (i + 1) +
                    ' из ' +
                    FILES.length +
                    ': ' +
                    file;

                const response =
                    await fetch(file, {
                        cache: 'no-cache'
                    });

                if (!response.ok) {

                    throw new Error(
                        file +
                        ' → HTTP ' +
                        response.status
                    );

                }

                await cache.put(
                    file,
                    response.clone()
                );

                const percent =
                    Math.round(
                        ((i + 1) / FILES.length) * 100
                    );

                progress.style.width =
                    percent + '%';
            }


            // Дополнительная проверка
            const index =
                await cache.match(
                    BASE + 'index.html'
                );

            const audio =
                await cache.match(
                    BASE + 'bh.mp3'
                );


            if (!index || !audio) {

                throw new Error(
                    'Файлы не найдены в кэше после загрузки'
                );

            }


            status.innerHTML =
                '<span class="ok">' +
                '✓ ВСЁ ГОТОВО' +
                '<br><br>' +
                'Страница и аудио сохранены.' +
                '<br>' +
                'Теперь можно закрыть браузер.' +
                '<br>' +
                'После отключения интернета сайт должен открыться снова.' +
                '</span>';

            downloadButton.textContent =
                'Офлайн-версия готова';


        } catch (error) {

            console.error(error);

            status.innerHTML =
                '<span class="error">' +
                'Ошибка: ' +
                error.message +
                '</span>';

            downloadButton.disabled = false;

        }

    }
);

</script>

</body>
</html>
